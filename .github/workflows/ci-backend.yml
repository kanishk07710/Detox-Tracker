name: CI — Backend

# Run on every PR and on pushes to main that touch backend code.
# Path filters ensure backend changes only trigger backend jobs.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    # ── Postgres service container ──────────────────────────────────────────
    # Integration tests use this throwaway database — NEVER the real Supabase.
    # The container is destroyed after the job finishes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: detox_test
        # Health check so the job waits until Postgres is actually ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: backend

    steps:
      # 1. Check out the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js with caching
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Lint
      - name: Lint
        run: npm run lint

      # 5. Type check
      - name: Typecheck
        run: npm run typecheck

      # 6. Run tests (unit + integration)
      # The DATABASE_URL points at the service container above — not Supabase.
      # SESSION_SECRET and FRONTEND_ORIGIN are set to dummy values for tests.
      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/detox_test
          DIRECT_URL: postgresql://testuser:testpassword@localhost:5432/detox_test
          SESSION_SECRET: ci-dummy-secret-at-least-32-characters-long
          FRONTEND_ORIGIN: http://localhost:3000

      # 7. Build — confirms TypeScript compiles cleanly
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/detox_test
          DIRECT_URL: postgresql://testuser:testpassword@localhost:5432/detox_test
          SESSION_SECRET: ci-dummy-secret-at-least-32-characters-long
          FRONTEND_ORIGIN: http://localhost:3000
